services:
  qa:
    build: .
    image: salesforce-sales-cloud-qa:latest
    environment:
      - SF_BASE_URL=${SF_BASE_URL:-https://login.salesforce.com}
      - SF_USERNAME=${SF_USERNAME}
      - SF_PASSWORD=${SF_PASSWORD}
      - SF_SECURITY_TOKEN=${SF_SECURITY_TOKEN}
      - BROWSER=chromium
      - HEADLESS=true
      - CI=true
    volumes:
      - ./test-results:/work/test-results
      - ./playwright-report:/work/playwright-report
    depends_on: []