<svg width="900" height="520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon fill="#334155" points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .title { font: 16px bold system-ui, -apple-system, sans-serif; fill: #0f172a; }
    .sub { font: 12px system-ui, -apple-system, sans-serif; fill: #64748b; }
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
    .box.active { fill: #eff6ff; stroke: #2563eb; }
    .box.test { fill: #f0fdf4; stroke: #16a34a; }
    .box.api { fill: #eff6ff; stroke: #2563eb; }
    .box.env { fill: #f1f5f9; stroke: #475569; }
    .label { font: 12px bold system-ui, -apple-system, sans-serif; fill: #0f172a; }
    .desc { font: 11px system-ui, -apple-system, sans-serif; fill: #475569; }
    .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .edge.ci { stroke: #dc2626; stroke-dasharray: 6 4; }
  </style>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" class="title">Salesforce QA Automation Framework — System Architecture</text>

  <!-- CI (external) -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="200" height="90" class="box env"/>
    <text x="100" y="30" text-anchor="middle" class="label">GitHub Actions CI</text>
    <text x="100" y="48" text-anchor="middle" class="desc">PR • Main • Nightly • Manual</text>
    <text x="100" y="66" text-anchor="middle" class="desc">HTML + JUnit reports</text>
  </g>

  <!-- Tests -->
  <g transform="translate(300, 40)">
    <rect x="0" y="0" width="260" height="130" class="box test"/>
    <text x="130" y="30" text-anchor="middle" class="label">Tests</text>
    <text x="130" y="48" text-anchor="middle" class="desc">sales-cloud / service-cloud / api / integration</text>
    <text x="130" y="66" text-anchor="middle" class="desc">TC-01..16, SC-01..12, API-01..09, INT-01..02</text>
    <text x="130" y="84" text-anchor="middle" class="desc">@smoke • @regression tags</text>
    <text x="130" y="102" text-anchor="middle" class="desc">Playwright HTML + JUnit reports</text>
  </g>

  <!-- Fixtures -->
  <g transform="translate(300, 200)">
    <rect x="0" y="0" width="260" height="70" class="box"/>
    <text x="130" y="22" text-anchor="middle" class="label">Fixtures</text>
    <text x="130" y="40" text-anchor="middle" class="desc">global-fixtures.ts • auth • test-data factory</text>
    <text x="130" y="58" text-anchor="middle" class="desc">page object injection + synthetic data</text>
  </g>

  <!-- Pages -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="200" height="110" class="box"/>
    <text x="100" y="28" text-anchor="middle" class="label">Pages (POM)</text>
    <text x="100" y="46" text-anchor="middle" class="desc">BasePage, LoginPage</text>
    <text x="100" y="64" text-anchor="middle" class="desc">LeadPage, AccountPage, ContactPage</text>
    <text x="100" y="82" text-anchor="middle" class="desc">OpportunityPage, CasePage</text>
  </g>

  <!-- API -->
  <g transform="translate(300, 290)">
    <rect x="0" y="0" width="260" height="70" class="box api"/>
    <text x="130" y="22" text-anchor="middle" class="label">API Layer</text>
    <text x="130" y="40" text-anchor="middle" class="desc">SalesforceAPIClient — OAuth, SOQL, Case CRUD</text>
    <text x="130" y="58" text-anchor="middle" class="desc">Postman / Newman collections</text>
  </g>

  <!-- Utils -->
  <g transform="translate(60, 330)">
    <rect x="0" y="0" width="200" height="70" class="box"/>
    <text x="100" y="28" text-anchor="middle" class="label">Utils</text>
    <text x="100" y="46" text-anchor="middle" class="desc">test-utils.ts — retry, screenshots, random data</text>
  </g>

  <!-- Factory -->
  <g transform="translate(300, 380)">
    <rect x="0" y="0" width="260" height="70" class="box"/>
    <text x="130" y="28" text-anchor="middle" class="label">Factories</text>
    <text x="130" y="46" text-anchor="middle" class="desc">test-data.factory.ts • auth.fixture.ts</text>
    <text x="130" y="64" text-anchor="middle" class="desc">unique synthetic data per record</text>
  </g>

  <!-- Config -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="200" height="80" class="box"/>
    <text x="100" y="28" text-anchor="middle" class="label">Config</text>
    <text x="100" y="46" text-anchor="middle" class="desc">playwright.config.ts • tsconfig.json • package.json</text>
    <text x="100" y="64" text-anchor="middle" class="desc">JUnit + HTML reporters</text>
  </g>

  <!-- Env -->
  <g transform="translate(300, 470)">
    <rect x="0" y="0" width="260" height="40" class="box env"/>
    <text x="130" y="22" text-anchor="middle" class="label">Environment (.env, never committed)</text>
  </g>

  <!-- SQL -->
  <g transform="translate(600, 260)">
    <rect x="0" y="0" width="150" height="70" class="box"/>
    <text x="75" y="28" text-anchor="middle" class="label">SQL Traceability</text>
    <text x="75" y="46" text-anchor="middle" class="desc">PostgreSQL schema.sql</text>
  </g>

  <!-- Edges -->
  <line x1="260" y1="125" x2="300" y2="105" class="edge"/>
  <line x1="260" y1="125" x2="300" y2="165" class="edge"/>
  <line x1="430" y1="105" x2="300" y2="235" class="edge"/>
  <line x1="260" y1="125" x2="300" y2="235" class="edge"/>
  <line x1="430" y1="235" x2="300" y2="325" class="edge"/>
  <line x1="160" y1="255" x2="200" y2="255" class="edge"/>
  <line x1="430" y1="235" x2="430" y2="325" class="edge"/>
  <line x1="160" y1="365" x2="300" y2="415" class="edge"/>
  <line x1="160" y1="460" x2="300" y2="490" class="edge"/>
  <line x1="430" y1="510" x2="430" y2="295" class="edge"/>
  <line x1="430" y1="295" x2="600" y2="295" class="edge"/>

  <!-- CI edges -->
  <line x1="160" y1="125" x2="300" y2="75" class="edge ci"/>
  <line x1="600" y1="295" x2="430" y2="450" class="edge ci"/>

</svg>
